services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reservations -d reservations"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
  kafka:
    image: apache/kafka:4.0.1
    profiles: [events]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
  app:
    build: .
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:postgresql://postgres:5432/reservations?options=-c%20lock_timeout=5000
      DATABASE_USER: reservations
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      REDIS_HOST: redis
      CACHE_ENABLED: "true"
      EVENTS_ENABLED: ${EVENTS_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALICE_PASSWORD: ${ALICE_PASSWORD:-demo-alice-password}
      BOB_PASSWORD: ${BOB_PASSWORD:-demo-bob-password}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo-admin-password}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 768m
volumes:
  postgres-data:
  kafka-data:

name: Prepare playground contract
on:
  push:
    branches: [feat/inventory-playground-20260930]
    paths: [.github/workflows/prepare-playground.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inventory-playground-20260930
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Update the demo response and its database assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/java/dev/ryanpark/reservation/demo/DemoService.java')
          s = p.read_text()
          replacements = {
            'product("contention", 25)': 'product("contention", 5)',
            'IntStream.range(0, 120)': 'IntStream.range(0, 100)',
            'owner, "request-" + index': 'owner + "-" + index, "request-" + index',
            'After 120 requests': 'After 100 requests',
            'Exactly 25 reservations accepted': 'Exactly 5 reservations accepted',
            'count(attempts, "RESERVED") == 25': 'count(attempts, "RESERVED") == 5',
            'Exactly 25 order rows persisted': 'Exactly 5 order rows persisted',
            'orderCount(product) == 25': 'orderCount(product) == 5',
            'stock(after, 0, 25, 0)': 'stock(after, 0, 5, 0)',
            '120 service calls on 16 server worker threads, not 120 simultaneous connections.': '100 reservation calls for 100 distinct generated customers on 16 server worker threads, not 100 simultaneous HTTP connections.',
            '"Demo: " + name,\n            2500,': '"Vector One",\n            89900,',
            'private Attempt attempt(Callable<OrderView> call) throws Exception {\n    try {': 'private Attempt attempt(Callable<OrderView> call) throws Exception {\n    long started = System.nanoTime();\n    try {',
            'new Attempt(order.status().name(), order.id())': 'new Attempt(order.status().name(), order.id(), TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started))',
            'new Attempt(ex.code(), null)': 'new Attempt(ex.code(), null, TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started))',
            '        checks,\n        note);': '        checks,\n        note,\n        List.copyOf(attempts),\n        orderCount(steps.getLast().inventory()),\n        clock.instant().toString());',
            'private record Attempt(String code, UUID orderId) {}': 'public record Attempt(String code, UUID orderId, long durationMs) {}',
            '      String note) {}': '      String note,\n      List<Attempt> attempts,\n      long persistedOrders,\n      String completedAt) {}',
          }
          for old, new in replacements.items():
            assert s.count(old) == 1, repr(old)
            s = s.replace(old, new)
          p.write_text(s)
          p = Path('src/test/java/dev/ryanpark/reservation/DemoScenariosTest.java')
          s = p.read_text().replace('entry("RESERVED", 25L)', 'entry("RESERVED", 5L)').replace('containsExactly(0, 25, 0)', 'containsExactly(0, 5, 0)').replace('.isEqualTo(25);', '.isEqualTo(5);')
          extra = '''
            @Test
            void requestRecordsMatchOutcomesAndActualDatabaseRows() throws Exception {
              for (var scenario : List.of("contention", "idempotency", "race")) {
                var result = demo.run(scenario);
                assertThat(result.passed()).isTrue();
                var expectedSize = switch (scenario) {
                  case "contention" -> 100;
                  case "idempotency" -> 17;
                  default -> 2;
                };
                assertThat(result.attempts()).hasSize(expectedSize);
                assertThat(result.attempts()).allSatisfy(attempt -> assertThat(attempt.durationMs()).isNotNegative());
                var histogram = result.attempts().stream().collect(java.util.stream.Collectors.groupingBy(DemoService.Attempt::code, java.util.stream.Collectors.counting()));
                assertThat(histogram).isEqualTo(result.outcomes());
                var productId = result.snapshots().getLast().inventory().id();
                var persisted = jdbc.queryForList("SELECT id FROM reservations WHERE product_id = ?", UUID.class, productId);
                assertThat(result.persistedOrders()).isEqualTo(persisted.size());
                var returned = result.attempts().stream().map(DemoService.Attempt::orderId).filter(java.util.Objects::nonNull).distinct().toList();
                assertThat(returned).containsExactlyInAnyOrderElementsOf(persisted);
                assertThat(java.time.Instant.parse(result.completedAt())).isNotNull();
                if (scenario.equals("contention")) {
                  assertThat(jdbc.queryForObject("SELECT COUNT(DISTINCT owner_id) FROM reservations WHERE product_id = ?", Long.class, productId)).isEqualTo(5);
                }
                if (scenario.equals("race")) {
                  assertThat(result.attempts().get(0).code()).isIn("CONFIRMED", "INVALID_TRANSITION");
                  assertThat(result.attempts().get(1).code()).isIn("CANCELLED", "INVALID_TRANSITION");
                }
              }
            }

            @Test
            void sequentialScenariosExposeSnapshotsWithoutInventedRequestRecords() throws Exception {
              for (var scenario : List.of("lifecycle", "expiry")) {
                var result = demo.run(scenario);
                assertThat(result.attempts()).isEmpty();
                assertThat(result.persistedOrders()).isEqualTo(scenario.equals("lifecycle") ? 3 : 1);
                assertThat(result.snapshots()).isNotEmpty();
              }
            }
          '''
          s = s.rstrip()[:-1] + extra + '\n}\n'
          p.write_text(s)
          Path('.github/workflows/prepare-playground.yml').unlink()
      - run: ./mvnw -B -ntp spotless:apply
      - name: Commit the formatted contract, removing this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/ryanpark/reservation/demo/DemoService.java src/test/java/dev/ryanpark/reservation/DemoScenariosTest.java .github/workflows/prepare-playground.yml
          git commit -m "feat: expose recorded request outcomes and five-unit flash sale"
          git push origin HEAD:feat/inventory-playground-20260930

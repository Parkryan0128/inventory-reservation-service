name: Acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Demo client tests
        run: npm test
      - name: Unit, HTTP, Kafka, PostgreSQL and Redis acceptance
        run: ./mvnw -B -ntp verify
      - name: Validate Compose configuration and image build
        run: |
          docker compose config --quiet
          docker compose build app
      - name: End-to-end Compose smoke
        run: |
          docker compose up -d
          python3 scripts/smoke.py --wait 150 --require-events
          python3 scripts/contention.py --requests 120 --stock 25 --workers 16
      - name: Browser acceptance against Compose
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Public production stack over HTTPS
        run: bash scripts/public-deployment-ci.sh
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag inventory-public-ci:tested "$image"
          docker push "$image"
          docker logout ghcr.io
          printf 'Published tested image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color
          if [ -f deploy/.env.production ]; then
            APP_IMAGE=inventory-public-ci:tested docker compose --env-file deploy/.env.production -f deploy/compose.yml logs --no-color
          fi
          docker logs inventory-proxy-ci 2>/dev/null || true
      - name: Stop services
        if: always()
        run: |
          docker compose down -v
          docker rm -fv inventory-proxy-ci 2>/dev/null || true
          if [ -f deploy/.env.production ]; then
            APP_IMAGE=inventory-public-ci:tested docker compose --env-file deploy/.env.production -f deploy/compose.yml down -v
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            test-results/

name: Format demo branch
on:
  push:
    branches: [feat/one-click-demo-20260930]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-click-demo-20260930
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp spotless:apply
      - name: Commit formatting on the demo branch
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format one-click demo sources"
            git push origin HEAD:feat/one-click-demo-20260930
          fi

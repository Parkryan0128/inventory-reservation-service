spring:
  application:
    name: inventory-reservation-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reservations}
    username: ${DATABASE_USER:reservations}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  flyway:
    enabled: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  events:
    enabled: ${EVENTS_ENABLED:false}
    topic: orders.v1

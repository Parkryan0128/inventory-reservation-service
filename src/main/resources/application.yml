spring:
  application:
    name: inventory-reservation-service
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reservations}
    username: ${DATABASE_USER:reservations}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
      repositories:
        enabled: false
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
management:
  health:
    redis:
      # Redis is optional; cache failures must not remove a healthy API from service.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
app:
  security:
    alice-password: ${ALICE_PASSWORD}
    bob-password: ${BOB_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
  cache:
    enabled: ${CACHE_ENABLED:false}
  events:
    enabled: ${EVENTS_ENABLED:false}
    topic: orders.v1

name: inventory-production

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run deploy/init-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reservations -d reservations"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  kafka:
    <<: *runtime
    image: apache/kafka:4.0.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_SEGMENT_MS: 3600000
      KAFKA_LOG_RETENTION_BYTES: 268435456
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 1g
  app:
    <<: *runtime
    image: ${APP_IMAGE:?Run deploy/init-env.sh first}
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: public-demo
      DEMO_HOST: ${DEMO_HOST:?Set the public hostname}
      DATABASE_URL: jdbc:postgresql://postgres:5432/reservations?options=-c%20lock_timeout=5000
      DATABASE_USER: reservations
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks:
      backend:
      edge:
        aliases: [inventory-app]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m

volumes:
  postgres-data:
  kafka-data:
networks:
  backend:
    internal: true
  edge:
    external: true
    name: portfolio-edge
